# Tickr - nginx reverse proxy.
#
# Serves the React app and forwards /api to the Django backend, so the browser only
# ever talks to one origin (no CORS needed).
#
# Development: the app comes from the Vite dev server (npm run dev, port 5175).
# Production:  swap the "location /" block for the static-files block below.
#
# Run unprivileged from the repo root:
#   nginx -c "$PWD/nginx/nginx.conf" -e /tmp/tickr-nginx-error.log

pid /tmp/tickr-nginx.pid;
error_log /tmp/tickr-nginx-error.log;

events {}

http {
    access_log /tmp/tickr-nginx-access.log;
    client_body_temp_path /tmp/tickr-nginx-body;
    proxy_temp_path /tmp/tickr-nginx-proxy;
    fastcgi_temp_path /tmp/tickr-nginx-fastcgi;
    uwsgi_temp_path /tmp/tickr-nginx-uwsgi;
    scgi_temp_path /tmp/tickr-nginx-scgi;

    server {
        listen 8095;
        server_name localhost;

        # Django REST API
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (development): Vite dev server, including hot reload websocket
        location / {
            proxy_pass http://127.0.0.1:5175;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Frontend (production): comment out the block above and use this instead.
        # root /var/www/tickr;   # copy frontend/dist here after `npm run build`
        # location / {
        #     try_files $uri /index.html;
        # }
    }
}
